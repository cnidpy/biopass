# Doorway Cortex Bio-Pass — full stack for a single VPS.
# All data stored locally: PostgreSQL volume + bind-mounted upload/session dirs.
#
#   cp backend/.env.example backend/.env   # then fill secrets
#   docker compose up -d --build
#   # frontend on :8080, backend API on :4000, Postgres on :5432
#
# For local development you usually only need Postgres:
#   docker compose up -d postgres
#   (then run backend/frontend with `npm run dev`)

services:
  postgres:
    image: postgres:16-alpine
    container_name: biopass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsflow_biopass
    ports:
      - "5432:5432"
    volumes:
      - biopass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsflow_biopass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: biopass_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/whatsflow_biopass?schema=public"
      BASE_URL: "http://localhost:4000"
      FRONTEND_URL: "http://localhost:8080"
      PUBLIC_EMERGENCY_BASE_URL: "http://localhost:8080/e"
      CORS_ORIGINS: "http://localhost:8080"
      USE_LOCAL_STORAGE: "true"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/auth_info_baileys:/app/auth_info_baileys
      - biopass_tesscache:/app/.tess-cache
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: biopass_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  biopass_pgdata:
  biopass_tesscache:
