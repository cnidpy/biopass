# Doorway Cortex Bio-Pass — local infrastructure
# Brings up PostgreSQL (relational data) + MinIO (S3-compatible object storage).
# The backend/frontend run on the host with `npm run dev` (see README).
#
#   docker compose up -d
#   cd backend && npm run prisma:migrate && npm run prisma:seed && npm run dev
#
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: biopass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsflow_biopass
    ports:
      - "5432:5432"
    volumes:
      - biopass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsflow_biopass"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: biopass_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - biopass_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket declared in backend/.env (S3_BUCKET_NAME) on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/biopass-medical-vault &&
      mc anonymous set none local/biopass-medical-vault &&
      echo 'MinIO bucket biopass-medical-vault ready';
      "

volumes:
  biopass_pgdata:
  biopass_minio:
